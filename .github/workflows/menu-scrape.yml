name: Menüyü Scrape Et

on:
  repository_dispatch:
    types: [trigger-scrape]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu Çek (Checkout)
        uses: actions/checkout@v6

      - name: pnpm Kur
        uses: pnpm/action-setup@v5
        with:
          version: 9

      - name: Node.js Kur
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Bağımlılıkları Yükle
        run: pnpm install --frozen-lockfile

      # Bozuk sözlükle veri yazmamak için scrape'ten ÖNCE doğrula.
      - name: Alerjen Motorunu Doğrula
        run: pnpm run verify-allergens

      # Scrape, menüyü çektikten sonra alerjen zenginleştirmesini de çalıştırır.
      # lib/allergens.ts sözlüğünde bulunmayan bir malzeme çıkarsa script
      # ::warning:: anotasyonu + job özeti üretir ve exit 0 ile devam eder:
      # menü scrape'i sözlük eskidiği için düşürülmez, ama uyarı gözden kaçmaz.
      # Uyarı gördüğünde sözlüğü güncelle ve `pnpm enrich` ile eski veriyi tazele.
      - name: Menüyü Scrape Et ve Alerjenleri Etiketle
        run: pnpm run scrape

      - name: Değişiklikleri Kontrol Et ve Pushla
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add public/data/
          # Eğer değişiklik varsa commit at ve pushla
          git diff --quiet && git diff --staged --quiet || (git commit -m "scraping: Günlük menü güncellemesi" && git push)
